name: POC-003 hermetic validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  poc003:
    name: POC-003 / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The hermetic suite must be independent of PapyrusCompiler.exe: the
        # real compiler is a local/proprietary dependency that is never
        # downloaded and never required on a runner. The suite uses python.exe
        # as a controlled stand-in but still exercises the real spawn,
        # deadline, capture, Job Object cleanup and process-tree code. Job
        # Objects and Toolhelp32 are Windows-only, so the matrix is
        # windows-latest only.
        os: [windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow imports and executes pull-request code through
          # unittest, so the checkout token must not survive into the step that
          # runs it. No later step needs authenticated Git access.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall research/poc_003
      - name: Test
        run: python -m unittest discover -s research/poc_003/tests -v