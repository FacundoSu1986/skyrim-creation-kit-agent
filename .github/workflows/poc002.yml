name: POC-002 validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  poc002:
    name: POC-002 / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: research/poc_002
        run: python -m compileall .
      - name: Test
        working-directory: research/poc_002
        run: python -m unittest test_suite.py -v
