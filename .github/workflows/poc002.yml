name: POC-002 validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  poc002:
    name: POC-002 / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        working-directory: research/poc_002
        run: python -m compileall .
      - name: Test
        working-directory: research/poc_002
        run: python -m unittest test_suite.py -v
