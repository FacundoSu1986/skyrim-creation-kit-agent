name: Discovery Desk validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Discovery Desk / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]
    env:
      DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Verify integrity manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Install (npm ci)
        run: npm ci
      - name: Security audit (high/critical)
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Start PostgreSQL container
        run: |
          docker run -d --name test-postgres -p 5432:5432 -e POSTGRES_PASSWORD=password -e POSTGRES_DB=postgres postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          READY=false
          for i in $(seq 1 60); do
            if docker exec test-postgres pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt $i)."
              READY=true
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' test-postgres 2>/dev/null | grep -q '^true$'; then
              echo "ERROR: PostgreSQL container stopped unexpectedly before becoming ready."
              docker ps -a
              docker logs test-postgres || true
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "ERROR: PostgreSQL did not become ready within 60 seconds."
            docker ps -a
            docker logs test-postgres || true
            exit 1
          fi
      - name: Migration Lifecycle Tests (Fresh DB & Existing Pre-PR Adoption)
        run: npx tsx tests/migration-lifecycle.test.ts
      - name: Build
        run: npm run build
      - name: Stop PostgreSQL container
        if: always()
        run: docker rm -f test-postgres || true
