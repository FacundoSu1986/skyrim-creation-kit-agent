name: POC-IPC-001 validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ipc:
    name: POC-IPC-001 / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall research/poc_ipc_001
      - name: Test
        run: python -m unittest discover -s research/poc_ipc_001/tests -v
