[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrim-creation-kit-agent"
version = "0.0.0"
description = "Safety-first research for AI-assisted Skyrim SE/AE authoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FacundoSu1986" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["research/poc_002"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["archive"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^research/poc_002/test_suite.py$"]
